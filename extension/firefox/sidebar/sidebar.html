<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lorekeeper Sidecar</title>
    <link rel="stylesheet" href="./sidebar.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Lorekeeper</p>
        <h1>Provider Sidecar</h1>
      </header>

      <section class="panel">
        <div class="panel-title">
          <h2>ChatGPT Tab</h2>
          <button id="refresh-tabs" type="button">Refresh</button>
        </div>
        <select id="provider-tabs" aria-label="ChatGPT provider tab"></select>
        <p id="provider-status" class="muted">Select a logged-in ChatGPT tab.</p>
      </section>

      <section class="panel">
        <h2>Prompt</h2>
        <textarea id="prompt-input" spellcheck="false" placeholder="Paste or generate a Lorekeeper sidecar prompt here."></textarea>
        <div class="button-row">
          <button id="insert-prompt" type="button">Insert</button>
          <button id="send-prompt" type="button">Send + Read</button>
          <button id="copy-prompt" type="button">Copy</button>
        </div>
        <p class="muted">Send + Read submits the prompt to the selected provider tab and imports the latest response.</p>
      </section>

      <section class="panel">
        <h2>Latest Response</h2>
        <textarea id="response-output" spellcheck="false" readonly></textarea>
        <div class="button-row">
          <button id="read-response" type="button">Read Latest</button>
        </div>
      </section>
    </main>

    <script src="./sidebar.js"></script>
  </body>
</html>
