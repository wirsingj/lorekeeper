<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lorekeeper</title>
    <link rel="stylesheet" href="/app/styles.css?v=20260611-4" />
  </head>
  <body>
    <div id="app" class="handheld-shell">
      <header class="top-bar">
        <div>
          <p class="eyebrow">Campaign</p>
          <h1 id="campaign-title">Loading campaign...</h1>
        </div>
        <div class="top-meta">
          <select id="campaign-select" aria-label="Campaign selector">
            <option>Loading campaigns...</option>
          </select>
          <span id="scene-location">Loading...</span>
          <span id="provider-status">Provider: manual bridge</span>
          <span id="save-status">SQLite: local file ready</span>
        </div>
      </header>

      <aside class="left-panel panel-rail">
        <section class="rail-section">
          <div class="section-title">
            <h2>Party</h2>
            <div class="title-actions">
              <button class="icon-action" data-add-domain="party" type="button" title="Add party member">+</button>
              <span id="party-count" class="count-pill">0</span>
            </div>
          </div>
          <div id="party-list" class="record-stack"></div>
        </section>

        <section class="rail-section">
          <div class="section-title">
            <h2>Binder</h2>
          </div>
          <div class="button-stack">
            <button id="new-campaign" type="button">New Campaign</button>
            <button id="load-imported" type="button">Load Imported</button>
          </div>
        </section>

        <section class="rail-section">
          <div class="section-title">
            <h2>Provider</h2>
          </div>
          <div class="bridge-card">
            <div class="status-line">
              <span class="status-dot"></span>
              <span id="bridge-status">Manual copy/import ready</span>
            </div>
            <div class="button-stack">
              <button id="check-sidecar" type="button">Check / Open ChatGPT</button>
              <button id="copy-provider-prompt" type="button">Copy Provider Prompt</button>
            </div>
          </div>
        </section>
      </aside>

      <main class="play-screen" aria-label="Lorekeeper play screen">
        <div class="screen-bezel">
          <div id="play-log" class="play-log"></div>
        </div>
      </main>

      <aside class="right-panel panel-rail">
        <section class="rail-section">
          <div class="section-title">
            <h2>Threads</h2>
            <div class="title-actions">
              <button class="icon-action" data-add-domain="quests" type="button" title="Add thread">+</button>
              <span id="quest-count" class="count-pill">0</span>
            </div>
          </div>
          <div id="quest-list" class="record-stack"></div>
        </section>

        <section class="rail-section">
          <div class="section-title">
            <h2>Canon</h2>
            <div class="title-actions">
              <button class="icon-action" data-add-domain="people" type="button" title="Add person">P</button>
              <button class="icon-action" data-add-domain="places" type="button" title="Add place">L</button>
              <button class="icon-action" data-add-domain="lore" type="button" title="Add lore">N</button>
              <span id="context-count" class="count-pill">0</span>
            </div>
          </div>
          <div id="context-sections" class="context-stack"></div>
        </section>

        <section class="rail-section">
          <div class="section-title">
            <h2>Import Response</h2>
            <span id="review-count" class="count-pill">0</span>
          </div>
          <textarea id="response-import" class="rail-textarea" spellcheck="false"></textarea>
          <div class="button-stack two-up">
            <button id="paste-response" type="button">Paste</button>
            <button id="import-response" type="button">Import</button>
          </div>
          <div class="button-stack">
            <button id="apply-approved" type="button">Apply Approved</button>
          </div>
          <div id="review-list" class="review-stack"></div>
        </section>

        <section class="rail-section">
          <div class="section-title">
            <h2>Assets</h2>
            <div class="title-actions">
              <button class="icon-action" data-add-domain="assets" type="button" title="Add source image">+</button>
              <span id="asset-count" class="count-pill">0</span>
            </div>
          </div>
          <div id="asset-grid" class="asset-strip"></div>
        </section>
      </aside>

      <footer class="command-deck">
        <form id="player-form" class="player-form">
          <label for="player-input">Lorekeeper Input</label>
          <div class="input-row">
            <textarea
              id="player-input"
              rows="3"
              spellcheck="true"
              placeholder="Describe your action, question, or scene intent here. Lorekeeper will build the provider prompt."
            ></textarea>
            <button id="build-turn" type="submit">Send Turn</button>
          </div>
        </form>
        <details class="prompt-drawer">
          <summary>
            <span>Provider Prompt</span>
            <span id="prompt-size">0 chars</span>
          </summary>
          <textarea id="prompt-output" spellcheck="false"></textarea>
        </details>
      </footer>
    </div>

    <dialog id="record-dialog" class="record-dialog">
      <form id="record-form" method="dialog">
        <header class="dialog-header">
          <div>
            <p class="eyebrow">Binder</p>
            <h2 id="record-dialog-title">Add Record</h2>
          </div>
          <button id="close-record-dialog" class="icon-action" type="button" title="Close">x</button>
        </header>
        <input id="record-domain" name="domain" type="hidden" />
        <label>
          <span id="record-name-label">Name</span>
          <input id="record-name" name="name" autocomplete="off" required />
        </label>
        <label>
          <span id="record-role-label">Role / Type</span>
          <input id="record-role" name="role" autocomplete="off" />
        </label>
        <label id="record-path-row">
          <span>File path</span>
          <input id="record-path" name="path" autocomplete="off" placeholder="C:\path\to\image.png" />
        </label>
        <label>
          <span>Notes</span>
          <textarea id="record-notes" name="notes" rows="5"></textarea>
        </label>
        <footer class="dialog-actions">
          <button id="save-record" type="submit">Save To SQLite</button>
        </footer>
      </form>
    </dialog>

    <dialog id="campaign-dialog" class="record-dialog">
      <form id="campaign-form" method="dialog">
        <header class="dialog-header">
          <div>
            <p class="eyebrow">Campaign</p>
            <h2>New Campaign</h2>
          </div>
          <button id="close-campaign-dialog" class="icon-action" type="button" title="Close">x</button>
        </header>
        <label>
          <span>Campaign name</span>
          <input id="new-campaign-title" autocomplete="off" required value="New Campaign Binder" />
        </label>
        <label>
          <span>Premise</span>
          <textarea id="new-campaign-premise" rows="5">A new D&D 5e-lite campaign ready to grow through play.</textarea>
        </label>
        <footer class="dialog-actions">
          <button type="submit">Create Campaign</button>
        </footer>
      </form>
    </dialog>

    <dialog id="confirm-dialog" class="record-dialog confirm-dialog">
      <form id="confirm-form" method="dialog">
        <header class="dialog-header">
          <div>
            <p id="confirm-eyebrow" class="eyebrow">Confirm</p>
            <h2 id="confirm-title">Are you sure?</h2>
          </div>
          <button id="close-confirm-dialog" class="icon-action" type="button" title="Close">x</button>
        </header>
        <p id="confirm-message" class="dialog-copy"></p>
        <footer class="dialog-actions">
          <button id="cancel-confirm" type="button" class="secondary-action">Cancel</button>
          <button id="accept-confirm" type="submit">Continue</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/app/app.js?v=20260611-4"></script>
  </body>
</html>
